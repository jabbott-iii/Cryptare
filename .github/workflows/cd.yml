name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # go-sqlite3 needs CGO, so each target is built with a native C toolchain on
  # a runner of the matching OS (darwin/amd64 is cross-compiled by clang on the
  # Apple Silicon runner). Third-party actions are pinned to full commit SHAs.
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-latest, smoke: true }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm, smoke: true }
          - { goos: darwin, goarch: arm64, runner: macos-latest, smoke: true }
          - { goos: darwin, goarch: amd64, runner: macos-latest, smoke: false }
          - { goos: windows, goarch: amd64, runner: windows-latest, smoke: true }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # manual run fallback
            echo "tag=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        id: build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="dist/cryptare_${GOOS}_${GOARCH}${ext}"
          tags=""
          ldflags="-s -w -X main.version=${VERSION}"
          if [ "$GOOS" = "linux" ]; then
            # Link statically so the binary does not depend on the runner's glibc
            # version; netgo/osusergo avoid glibc NSS, and extension loading
            # (dlopen) is not used by Cryptare.
            tags="sqlite_omit_load_extension,osusergo,netgo"
            ldflags="$ldflags -linkmode external -extldflags -static"
          fi
          mkdir -p dist
          go build -tags "$tags" -ldflags="$ldflags" -o "$out" .
          echo "binary=$out" >> "$GITHUB_OUTPUT"

      - name: Smoke test binary
        if: matrix.smoke
        shell: bash
        env:
          CRYPTARE_DB_PATH: ${{ runner.temp }}/smoke.db
          VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          bin="./${{ steps.build.outputs.binary }}"
          # The printed version must carry the tag stamped in by -X main.version.
          "$bin" --version | grep -qF -- "$VERSION"
          if [ "${{ matrix.goos }}" = "linux" ]; then
            file "$bin" | grep -q "statically linked"
          fi
          # Throwaway test passphrase, passed by file so it stays out of the arguments.
          printf 'release-smoke-passphrase\n' > smoke-pw.txt
          "$bin" keys generate --password-file smoke-pw.txt
          "$bin" keys list | grep -q "AES-256-GCM"
          printf 'cryptare release smoke test\n' > smoke.txt
          "$bin" encrypt smoke.txt --password-file smoke-pw.txt
          "$bin" decrypt smoke.txt.enc --output smoke.out --password-file smoke-pw.txt
          cmp smoke.txt smoke.out

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.build.outputs.binary }}
          if-no-files-found: error

  release:
    name: Package and Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No module cache in the job that publishes the release.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Licence texts of the Go standard library and of every module in the
      # binaries; each archive carries them with LICENSE and NOTICE (Q-006).
      - name: Generate third-party licences
        shell: bash
        run: bash scripts/third-party-licenses.sh THIRD_PARTY_LICENSES.txt

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist

      - name: Package release artifacts
        shell: bash
        run: |
          cd dist
          # Each archive holds the binary, LICENSE, NOTICE and THIRD_PARTY_LICENSES.txt.
          docs=(LICENSE NOTICE THIRD_PARTY_LICENSES.txt)
          for bin in cryptare_*; do
            name="${bin%.exe}"
            chmod +x "$bin"
            if [ "$bin" != "$name" ]; then
              zip -q "${name}.zip" "$bin"
              (cd .. && zip -q "dist/${name}.zip" "${docs[@]}")
            else
              tar -czf "${name}.tar.gz" "$bin" -C .. "${docs[@]}"
            fi
            rm "$bin"
          done
          ls -l

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum -- * > checksums.txt

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
