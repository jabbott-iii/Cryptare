name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # go-sqlite3 needs CGO, so each target is built with a native C toolchain on
  # a runner of the matching OS (darwin/amd64 is cross-compiled by clang on the
  # Apple Silicon runner). Third-party actions are pinned to full commit SHAs.
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-latest, smoke: true }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm, smoke: true }
          - { goos: darwin, goarch: arm64, runner: macos-latest, smoke: true }
          - { goos: darwin, goarch: amd64, runner: macos-latest, smoke: false }
          - { goos: windows, goarch: amd64, runner: windows-latest, smoke: true }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # manual run fallback
            echo "tag=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        id: build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          VERSION: ${{ steps.meta.outputs.tag }}
          # The Dockerfile's builder image, pinned by digest. Linux binaries are linked
          # statically against its musl C library (MIT) instead of the runner's glibc
          # (LGPL) (Q-013). Update it with the Dockerfile when go.mod's toolchain changes.
          LINUX_BUILDER: golang:1.26.8-alpine@sha256:8ac98ca534ac3f51e1f420a1dd2c15e74c75cfa0f23f3ad27eb5d7236c349a0c
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="dist/cryptare_${GOOS}_${GOARCH}${ext}"
          tags=""
          ldflags="-s -w -X main.version=${VERSION}"
          mkdir -p dist
          if [ "$GOOS" = "linux" ]; then
            # Static, so the binary runs on any Linux; netgo/osusergo keep the C
            # library out of name and user lookups, and extension loading (dlopen)
            # is not used by Cryptare. The container runs on the runner's own
            # architecture, which the matrix pairs with GOARCH. GIT_OPTIONAL_LOCKS=0
            # stops VCS stamping from rewriting .git/index as root.
            tags="sqlite_omit_load_extension,osusergo,netgo"
            ldflags="$ldflags -linkmode external -extldflags -static"
            docker run --rm -v "$PWD:/src" -w /src \
              -e CGO_ENABLED -e GOOS -e GOARCH -e GIT_OPTIONAL_LOCKS=0 \
              -e TAGS="$tags" -e LDFLAGS="$ldflags" -e OUT="$out" \
              "$LINUX_BUILDER" sh -euc '
                apk add --no-cache build-base git >/dev/null
                git config --global --add safe.directory /src
                go build -tags "$TAGS" -ldflags="$LDFLAGS" -o "$OUT" .
                chown "$(stat -c %u:%g /src)" "$OUT"'
          else
            go build -tags "$tags" -ldflags="$ldflags" -o "$out" .
          fi
          echo "binary=$out" >> "$GITHUB_OUTPUT"

      - name: Smoke test binary
        if: matrix.smoke
        shell: bash
        env:
          CRYPTARE_DB_PATH: ${{ runner.temp }}/smoke.db
          VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          bin="./${{ steps.build.outputs.binary }}"
          # The printed version must carry the tag stamped in by -X main.version.
          "$bin" --version | grep -qF -- "$VERSION"
          if [ "${{ matrix.goos }}" = "linux" ]; then
            file "$bin" | grep -q "statically linked"
          fi
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # Only Windows system DLLs may be imported: the MinGW-w64 runtime and
            # libgcc are linked in, and their notices ship in THIRD_PARTY_LICENSES.txt
            # (Q-013). A DLL from the toolchain would also be missing on users' machines.
            if command -v objdump >/dev/null; then
              objdump -p "$bin" | grep -i "DLL Name" | tee dlls.txt
              if grep -iE 'lib(winpthread|gcc|stdc|ssp)' dlls.txt; then
                echo "::error::The binary imports a MinGW-w64 toolchain DLL."
                exit 1
              fi
            else
              echo "::warning::objdump not found; the binary's DLL imports were not checked."
            fi
          fi
          # Throwaway test passphrase, passed by file so it stays out of the arguments.
          printf 'release-smoke-passphrase\n' > smoke-pw.txt
          "$bin" keys generate --password-file smoke-pw.txt
          "$bin" keys list | grep -q "AES-256-GCM"
          printf 'cryptare release smoke test\n' > smoke.txt
          "$bin" encrypt smoke.txt --password-file smoke-pw.txt
          "$bin" decrypt smoke.txt.enc --output smoke.out --password-file smoke-pw.txt
          cmp smoke.txt smoke.out

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.build.outputs.binary }}
          if-no-files-found: error

  release:
    name: Package and Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestations: signed with the workflow's OIDC identity and
      # stored with the repository's attestations.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No module cache in the job that publishes the release.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Licence texts of the Go standard library and of every module in the
      # binaries; each archive carries them with LICENSE and NOTICE (Q-006).
      - name: Generate third-party licences
        shell: bash
        run: bash scripts/third-party-licenses.sh THIRD_PARTY_LICENSES.txt

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist

      - name: Package release artifacts
        shell: bash
        run: |
          cd dist
          # Each archive holds the binary, LICENSE, NOTICE and THIRD_PARTY_LICENSES.txt.
          docs=(LICENSE NOTICE THIRD_PARTY_LICENSES.txt)
          for bin in cryptare_*; do
            name="${bin%.exe}"
            chmod +x "$bin"
            if [ "$bin" != "$name" ]; then
              zip -q "${name}.zip" "$bin"
              (cd .. && zip -q "dist/${name}.zip" "${docs[@]}")
            else
              tar -czf "${name}.tar.gz" "$bin" -C .. "${docs[@]}"
            fi
            rm "$bin"
          done
          ls -l

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum -- * > checksums.txt

      # Signed SLSA build provenance for every published file, so a download can be
      # checked as built by this workflow from this repository, which checksums.txt
      # alone can't show: gh attestation verify <file> --repo jabbott-iii/Cryptare
      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # The Docker image, published to GitHub Packages (ghcr.io/<owner>/cryptare) on tags,
  # after the release job, so an image is never published for a release that failed.
  # A manual run builds and smoke-tests the image without publishing it. Plain docker
  # commands, as in docker.yml, keep third-party actions out of the job that holds
  # packages: write.
  container:
    name: Container image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Build provenance for the image, stored with the repository's attestations and
      # pushed to the registry next to the image.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tags: X.Y.Z always; X.Y and latest only when this is the newest release of that
      # line and overall, so publishing an older patch release later doesn't move them
      # back. Pre-releases (vX.Y.Z-rc.1) get only their own tag.
      - name: Set image metadata
        id: meta
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cryptare"
          if [ "$REF_TYPE" = "tag" ]; then
            if ! [[ "$REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag $REF_NAME isn't vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE."
              exit 1
            fi
            major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}"
            version="${REF_NAME#v}"
            stamp="$REF_NAME"
            tags="$version"
            if [[ "$version" != *-* ]]; then
              releases="$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)"
              if [ "$(grep -E "^v${major}\.${minor}\." <<<"$releases" | tail -n1)" = "$REF_NAME" ]; then
                tags="$tags ${major}.${minor}"
              fi
              if [ "$(tail -n1 <<<"$releases")" = "$REF_NAME" ]; then
                tags="$tags latest"
              fi
            fi
          else
            version="manual-${GITHUB_RUN_NUMBER}"
            stamp="$version"
            tags="$version"
          fi
          echo "Image $image, tags: $tags"
          {
            echo "image=$image"
            echo "version=$version"
            echo "stamp=$stamp"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      # The source label links the package to this repository on GitHub (its page and
      # its access settings).
      - name: Build image
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          STAMP: ${{ steps.meta.outputs.stamp }}
        run: |
          docker build --file Dockerfile \
            --build-arg VERSION="$STAMP" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --label "org.opencontainers.image.title=cryptare" \
            --label "org.opencontainers.image.description=Terminal file encryption and compression tool" \
            --tag "$IMAGE:$VERSION" .

      - name: Smoke test image
        shell: bash
        env:
          REF: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          STAMP: ${{ steps.meta.outputs.stamp }}
        run: |
          docker run --rm "$REF" --version | grep -qF -- "$STAMP"
          # The image must run as its unprivileged user, never root (SEC-013).
          test "$(docker run --rm --entrypoint id "$REF" -u)" = 10001
          # Throwaway test passphrase, mounted as a file so it stays out of the arguments.
          docker volume create cryptare-release-smoke
          printf 'release-smoke-passphrase\n' > smoke-pw.txt
          docker run --rm -v cryptare-release-smoke:/app/data -v "$PWD/smoke-pw.txt:/run/smoke-pw.txt:ro" \
            "$REF" keys generate --password-file /run/smoke-pw.txt
          docker run --rm -v cryptare-release-smoke:/app/data "$REF" keys list | grep -q "AES-256-GCM"

      - name: Log in to GitHub Packages
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        id: push
        if: github.ref_type == 'tag'
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            if [ "$tag" != "$VERSION" ]; then
              docker tag "$IMAGE:$VERSION" "$IMAGE:$tag"
            fi
            docker push "$IMAGE:$tag" | tee -a push.log
          done
          # Every tag names the same image; its digest is what the attestation covers.
          digest="$(grep -oE 'digest: sha256:[0-9a-f]{64}' push.log | head -n1 | cut -d' ' -f2)"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Couldn't read the pushed image's digest."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE@$digest as: $TAGS"

      # Verify with: gh attestation verify oci://ghcr.io/<owner>/cryptare:<version> --repo <owner>/Cryptare
      - name: Attest image provenance
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records are only for organisation-owned repositories.
          create-storage-record: false

      - name: Log out of GitHub Packages
        if: always() && github.ref_type == 'tag'
        run: docker logout ghcr.io
